; FrogUI Theme Configuration
; =========================
; Background and platform graphics are loaded automatically from:
;   resources/general/background.png (main background)
;   resources/{platform}/logo.png (per-platform backgrounds)

[theme]
; v20: Text background options (0=shadow, 1=rounded black bg)
platform_text_background = 0
game_text_background = 0
game_screenshot_x_start = 4
game_screenshot_x_end = 124
game_screenshot_y_start = 60
game_screenshot_y_end = 150
name = FrogUI

; --- XMB Wave Customization ---
; xmb_waves = true                ; Enable XMB waves (true/false)
; xmb_wave_color = FFFFFF         ; HEX color for the waves (e.g. FFFFFF for white)
; xmb_wave_glow = 2               ; Glow intensity (1=low, 2=medium, 3=high)
; xmb_wave_variety = 3            ; Wave complexity (1=single, 2=dual, 3=complex)

[layout]
; Platform list (main ROMS menu - list of consoles)
platform_list_x = 16
platform_list_y_start = 40
platform_list_y_end = 208
platform_item_height = 24
platform_visible_items = 7

; Game list (inside console folders - list of games)
game_list_x = 128
game_list_y_start = 40
game_list_y_end = 208
game_item_height = 24
game_visible_items = 7

; Thumbnail position
thumb_x = 160
thumb_y = 40
thumb_width = 150
thumb_height = 180

; Header (folder name at top)
header_x = 16
header_y = 10

; Legend (A/B/SELECT hints at bottom)
legend_x = 16
legend_y = 220

; Counter (e.g., "3/125" showing current/total)
counter_x = 308
counter_y = 8

[colors]
; Colors in RGB hex format (RRGGBB)
; Leave commented to use color theme from settings
;bg = 1E1E1E
;text = F5F5F5
;select_bg = 4A90D9
;select_text = FFFFFF
